name: corporate-database-local

# Start with backend/.env for the ${...} values (only Ollama uses them):
#   docker compose --env-file backend/.env -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${DB_PASSWORD:?is empty; run uv run install in backend/}"
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME"
        # Drop the rest of backend/.env (encryption key, other passwords);
        # the image's own variables stay.
        unset $$(compgen -e | grep -xE 'DB_.*|JWT_.*|DATA_.*|QDRANT_.*|S3_.*|STORAGE.*|VAULT_.*|OIDC_.*|KEY_STORE|LLM_.*|EMBEDDING_MODEL|APP_LANGUAGES?|CHUNK_.*|TEXT_.*|API_DOCS|SITE_ADDRESS|TLS|CHAT_.*|RABBITMQ_(USER|PASSWORD|HOST|PORT)')
        # POSTGRES_PASSWORD only applies to a new volume. Re-apply it on every
        # start (local socket, trusted) so a password rotated in .env works.
        (
          until pg_isready -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done
          echo "ALTER ROLE CURRENT_USER PASSWORD :'pw';" |
            psql -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v pw="$$POSTGRES_PASSWORD"
        ) &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    env_file:
      - ./backend/.env
    # Every request needs QDRANT_API_KEY; the other .env values stay out.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${QDRANT_API_KEY:?is empty; run uv run install in backend/}"
        exec env -i PATH="$$PATH" TZ=Etc/UTC RUN_MODE=production \
          QDRANT__SERVICE__API_KEY="$$QDRANT_API_KEY" ./entrypoint.sh
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - ./backend/.env
    # The default user is only created on a new volume. Re-apply the password
    # on every start so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${RABBITMQ_PASSWORD:?is empty; run uv run install in backend/}"
        export RABBITMQ_DEFAULT_USER="$$RABBITMQ_USER"
        export RABBITMQ_DEFAULT_PASS="$$RABBITMQ_PASSWORD"
        # Drop the rest of backend/.env (encryption key, other passwords);
        # the image's own variables stay.
        unset $$(compgen -e | grep -xE 'DB_.*|JWT_.*|DATA_.*|QDRANT_.*|S3_.*|STORAGE.*|VAULT_.*|OIDC_.*|KEY_STORE|LLM_.*|EMBEDDING_MODEL|APP_LANGUAGES?|CHUNK_.*|TEXT_.*|API_DOCS|SITE_ADDRESS|TLS|CHAT_.*|RABBITMQ_(USER|PASSWORD|HOST|PORT)')
        (
          until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1 ||
            rabbitmqctl -q change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl -q set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl -q set_permissions -p / "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    # Ollama has no auth; loopback only.
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - /dev/dri
    group_add:
      - "39"
      - "105"
    environment:
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_IGPU_ENABLE: "1"
      # LLM_PARALLEL answers at once (uv run configure); each reserves its own
      # context memory, which the 8-bit cache (needs flash attention) halves.
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single sign-on test provider (OpenID Connect), only when asked:
  #   docker compose --env-file backend/.env -f docker-compose.local.yml --profile sso up -d keycloak
  # Realm "archfold" from dev/keycloak/archfold-realm.json: users ana (group
  # Archfold Admins) and bob (Legal); admin console https://localhost:8443/admin
  # (admin / admin). Test values only: never use them anywhere else.
  # HTTPS, as Archfold requires of a provider: a self-signed certificate is made
  # on the first start; dev/keycloak/certs/ca.pem is the file OIDC_CACERT needs.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    profiles: [sso]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /certs/keycloak.p12 ]; then
          keytool -genkeypair -alias localhost -keyalg RSA -keysize 2048 -validity 825 \
            -dname CN=localhost -ext SAN=dns:localhost -storetype PKCS12 \
            -keystore /certs/keycloak.p12 -storepass local-test -keypass local-test
          keytool -exportcert -rfc -alias localhost -keystore /certs/keycloak.p12 \
            -storepass local-test > /certs/ca.pem
        fi
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --http-enabled=false \
          --https-key-store-file=/certs/keycloak.p12 --https-key-store-password=local-test
    volumes:
      - ./dev/keycloak/archfold-realm.json:/opt/keycloak/data/import/archfold-realm.json:ro
      - ./dev/keycloak/certs:/certs

  # S3 storage test server (VersityGW), for STORAGE=s3; only when asked:
  #   docker compose --env-file backend/.env -f docker-compose.local.yml --profile s3 up -d s3
  # http://localhost:7070, bucket archfold-documents, access key
  # archfold-local-access-key, secret key archfold-local-secret-key-0123456789.
  # Files on the s3_data volume (a bucket is a folder there). Test values
  # only: never use them anywhere else.
  s3:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    profiles: [s3]
    ports:
      - "127.0.0.1:7070:7070"
    environment:
      ROOT_ACCESS_KEY: archfold-local-access-key
      ROOT_SECRET_KEY: archfold-local-secret-key-0123456789
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/archfold-documents && exec versitygw --port :7070 posix /data
    volumes:
      - s3_data:/data

  # Key storage test server (HashiCorp Vault); starts with the rest.
  # http://localhost:8200, KV v2 at "secret", AppRole "archfold" reading
  # secret/data/archfold (role_id archfold-local-role-id, secret_id
  # archfold-local-secret-id), a token that may write it (archfold-local-admin-token).
  # Data on the vault_data volume: a key moved here survives restarts, and is
  # lost with the volume. Test values only: never use them anywhere else.
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - ./dev/vault/start.sh:/start.sh:ro
      - vault_data:/vault/file
    healthcheck:
      # Exits 0 only once Vault is unsealed and serving.
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  s3_data:
  ollama_data:
  vault_data:
