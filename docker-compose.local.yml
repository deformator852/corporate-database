name: corporate-database-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    # Loopback only: the API is for the local backend, the console for you.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ./backend/.env
    # Pass only the root credentials; MINIO_ACCESS_KEY/MINIO_SECRET_KEY in .env
    # belong to the app user and MinIO would read them as legacy root keys.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${MINIO_ROOT_PASSWORD:?is empty; run uv run setup in backend/}"
        exec env -i PATH="$$PATH" \
          MINIO_ROOT_USER="$$MINIO_ROOT_USER" \
          MINIO_ROOT_PASSWORD="$$MINIO_ROOT_PASSWORD" \
          minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket and the least-privilege app user from backend/.env.
  # Idempotent; runs on every `docker compose up`.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        : "$${MINIO_SECRET_KEY:?is empty; run uv run setup in backend/}"
        export MC_CONFIG_DIR=/tmp/mc
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null
        mc anonymous set none "local/$$MINIO_BUCKET" >/dev/null
        cat > /tmp/policy.json <<POLICY
        {"Version": "2012-10-17", "Statement": [{"Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
          "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]}]}
        POLICY
        mc admin policy create local corporate-app /tmp/policy.json >/dev/null
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc admin policy attach local corporate-app --user "$$MINIO_ACCESS_KEY" >/dev/null
        echo "MinIO ready: bucket $$MINIO_BUCKET, app user $$MINIO_ACCESS_KEY"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    devices:
      - /dev/dri
    group_add:
      - "39"
      - "105"
    environment:
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
