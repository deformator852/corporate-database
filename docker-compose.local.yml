name: corporate-database-local

# Start with backend/.env for the ${...} values (only Ollama uses them):
#   docker compose --env-file backend/.env -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${DB_PASSWORD:?is empty; run uv run setup in backend/}"
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME"
        # Drop the rest of backend/.env (encryption key, other passwords);
        # the image's own variables stay.
        unset $$(compgen -e | grep -xE 'DB_.*|JWT_.*|DATA_.*|QDRANT_.*|MINIO_.*|LLM_.*|EMBEDDING_MODEL|APP_LANGUAGES?|CHUNK_.*|TEXT_.*|API_DOCS|SITE_ADDRESS|TLS|CHAT_.*|RABBITMQ_(USER|PASSWORD|HOST|PORT)')
        # POSTGRES_PASSWORD only applies to a new volume. Re-apply it on every
        # start (local socket, trusted) so a password rotated in .env works.
        (
          until pg_isready -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done
          echo "ALTER ROLE CURRENT_USER PASSWORD :'pw';" |
            psql -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v pw="$$POSTGRES_PASSWORD"
        ) &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    env_file:
      - ./backend/.env
    # Every request needs QDRANT_API_KEY; the other .env values stay out.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${QDRANT_API_KEY:?is empty; run uv run setup in backend/}"
        exec env -i PATH="$$PATH" TZ=Etc/UTC RUN_MODE=production \
          QDRANT__SERVICE__API_KEY="$$QDRANT_API_KEY" ./entrypoint.sh
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - ./backend/.env
    # The default user is only created on a new volume. Re-apply the password
    # on every start so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${RABBITMQ_PASSWORD:?is empty; run uv run setup in backend/}"
        export RABBITMQ_DEFAULT_USER="$$RABBITMQ_USER"
        export RABBITMQ_DEFAULT_PASS="$$RABBITMQ_PASSWORD"
        # Drop the rest of backend/.env (encryption key, other passwords);
        # the image's own variables stay.
        unset $$(compgen -e | grep -xE 'DB_.*|JWT_.*|DATA_.*|QDRANT_.*|MINIO_.*|LLM_.*|EMBEDDING_MODEL|APP_LANGUAGES?|CHUNK_.*|TEXT_.*|API_DOCS|SITE_ADDRESS|TLS|CHAT_.*|RABBITMQ_(USER|PASSWORD|HOST|PORT)')
        (
          until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1 ||
            rabbitmqctl -q change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl -q set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl -q set_permissions -p / "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    # Loopback only: the API is for the local backend, the console for you.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ./backend/.env
    # Pass only the root credentials; MINIO_ACCESS_KEY/MINIO_SECRET_KEY in .env
    # belong to the app user and MinIO would read them as legacy root keys.
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${MINIO_ROOT_PASSWORD:?is empty; run uv run setup in backend/}"
        exec env -i PATH="$$PATH" \
          MINIO_ROOT_USER="$$MINIO_ROOT_USER" \
          MINIO_ROOT_PASSWORD="$$MINIO_ROOT_PASSWORD" \
          minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket and the least-privilege app user from backend/.env.
  # Idempotent; runs on every `docker compose up`.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        : "$${MINIO_SECRET_KEY:?is empty; run uv run setup in backend/}"
        export MC_CONFIG_DIR=/tmp/mc
        mc alias set -- local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null
        mc anonymous set none "local/$$MINIO_BUCKET" >/dev/null
        cat > /tmp/policy.json <<POLICY
        {"Version": "2012-10-17", "Statement": [{"Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
          "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]}]}
        POLICY
        mc admin policy create local corporate-app /tmp/policy.json >/dev/null
        mc admin user add -- local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc admin policy attach local corporate-app --user="$$MINIO_ACCESS_KEY" >/dev/null
        echo "MinIO ready: bucket $$MINIO_BUCKET, app user $$MINIO_ACCESS_KEY"

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    # Ollama has no auth; loopback only.
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - /dev/dri
    group_add:
      - "39"
      - "105"
    environment:
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_IGPU_ENABLE: "1"
      # LLM_PARALLEL answers at once (uv run configure); each reserves its own
      # context memory, which the 8-bit cache (needs flash attention) halves.
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single sign-on test provider (OpenID Connect), only when asked:
  #   docker compose --env-file backend/.env -f docker-compose.local.yml --profile sso up -d keycloak
  # Realm "corpus" from dev/keycloak/corpus-realm.json: users ana (group
  # Corpus Admins) and bob (Legal); admin console https://localhost:8443/admin
  # (admin / admin). Test values only: never use them anywhere else.
  # HTTPS, as Corpus requires of a provider: a self-signed certificate is made
  # on the first start; dev/keycloak/certs/ca.pem is the file OIDC_CACERT needs.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    profiles: [sso]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /certs/keycloak.p12 ]; then
          keytool -genkeypair -alias localhost -keyalg RSA -keysize 2048 -validity 825 \
            -dname CN=localhost -ext SAN=dns:localhost -storetype PKCS12 \
            -keystore /certs/keycloak.p12 -storepass local-test -keypass local-test
          keytool -exportcert -rfc -alias localhost -keystore /certs/keycloak.p12 \
            -storepass local-test > /certs/ca.pem
        fi
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --http-enabled=false \
          --https-key-store-file=/certs/keycloak.p12 --https-key-store-password=local-test
    volumes:
      - ./dev/keycloak/corpus-realm.json:/opt/keycloak/data/import/corpus-realm.json:ro
      - ./dev/keycloak/certs:/certs

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
