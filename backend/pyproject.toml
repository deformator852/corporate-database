[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authx>=1.7.1",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "chonkie>=1.7.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "joserfc>=1.7.5",
    "minio>=7.2.20",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic[email]>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
setup = "setup.app:main"
configure = "configure:main"
switch-embedding-model = "switch_embedding_model:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Scripts put src/ on sys.path before importing from it.
"evals/*.py" = ["E402"]
# .env is loaded before the app modules, which read settings on import.
"src/main.py" = ["E402"]
# The translation catalog keeps each message on one line.
"src/i18n.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
