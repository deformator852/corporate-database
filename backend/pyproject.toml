[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authx>=1.7.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = true

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/models/**.py" = ["F821"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
