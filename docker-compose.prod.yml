name: corpus

# Production stack. Run through deploy/deploy.sh: it passes backend/.env (or
# CORPUS_ENV_FILE) to fill the ${...} values below. Network isolation is the point of this file:
#   internal  - every service; no route to the internet (internal: true)
#   edge      - only the HTTPS proxy, the one published port
#   egress    - only the `models` job (profile "setup"), run on purpose to
#               download AI models, and vault-tunnel (KEY_STORE=vault), which
#               forwards to Vault alone; nothing else can reach out.

# Each container gets only the variables it needs (never the whole .env): a
# compromised proxy or database container must not see the encryption key,
# the JWT secret or other services' passwords. An empty optional value means
# the backend default (settings.py).
#   migrate  - database and search index only
#   worker   - + queue, file storage, encryption key, LLM
#   backend  - + JWT secret (sessions) and chat settings
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?is empty; run uv run setup in backend/}
  DB_PASSWORD: ${DB_PASSWORD:?is empty; run uv run setup in backend/}
  DB_NAME: ${DB_NAME:?is empty; run uv run setup in backend/}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_API_KEY: ${QDRANT_API_KEY:?is empty; run uv run setup in backend/}
  APP_LANGUAGE: ${APP_LANGUAGE:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?is empty; run uv run setup in backend/}

x-worker-env: &worker-env
  <<: *db-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?is empty; run uv run setup in backend/}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?is empty; run uv run setup in backend/}
  # The least-privilege app user only; MinIO root stays with minio/minio-init.
  MINIO_ENDPOINT: minio:9000
  MINIO_SECURE: "false"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?is empty; run uv run setup in backend/}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?is empty; run uv run setup in backend/}
  MINIO_BUCKET: ${MINIO_BUCKET:-}
  MINIO_REGION: ${MINIO_REGION:-}
  # KEY_STORE=env: the key below (and the previous one while rotating).
  # KEY_STORE=vault: read from HashiCorp Vault through vault-tunnel instead
  # (backend/src/key_store.py); the two key variables are then empty.
  KEY_STORE: ${KEY_STORE:-env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
  VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-}
  VAULT_KV_PATH: ${VAULT_KV_PATH:-}
  VAULT_CACERT: ${VAULT_CACERT:+/etc/corpus-vault/ca.pem}
  VAULT_CONNECT: ${VAULT_ADDR:+vault-tunnel:8200}
  LLM_HOST: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:?is empty; run uv run setup in backend/}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-}
  TEXT_CLEANUP: ${TEXT_CLEANUP:-}
  CHUNK_SIZE: ${CHUNK_SIZE:-}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-}

x-app: &app
  image: corpus-backend:latest
  restart: unless-stopped
  volumes:
    - hf_models:/models/hf
    # CA of Vault's certificate, copied here by `uv run setup` (not a secret).
    - ./deploy/vault:/etc/corpus-vault:ro
  networks: [internal]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?is empty; run uv run setup in backend/}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?is empty; run uv run setup in backend/}
      POSTGRES_DB: ${DB_NAME:?is empty; run uv run setup in backend/}
    # POSTGRES_PASSWORD only applies to a new volume; re-apply it on every
    # start (local socket, trusted) so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        (
          until pg_isready -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done
          echo "ALTER ROLE CURRENT_USER PASSWORD :'pw';" |
            psql -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v pw="$$POSTGRES_PASSWORD"
        ) &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?is empty; run uv run setup in backend/}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?is empty; run uv run setup in backend/}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?is empty; run uv run setup in backend/}
    # The default user is only created on a new volume; re-apply the password
    # on every start so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        (
          until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1 ||
            rabbitmqctl -q change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl -q set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl -q set_permissions -p / "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?is empty; run uv run setup in backend/}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?is empty; run uv run setup in backend/}
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?is empty; run uv run setup in backend/}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?is empty; run uv run setup in backend/}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?is empty; run uv run setup in backend/}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?is empty; run uv run setup in backend/}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    networks: [internal]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        export MC_CONFIG_DIR=/tmp/mc
        mc alias set -- local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null
        mc anonymous set none "local/$$MINIO_BUCKET" >/dev/null
        cat > /tmp/policy.json <<POLICY
        {"Version": "2012-10-17", "Statement": [{"Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
          "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]}]}
        POLICY
        mc admin policy create local corporate-app /tmp/policy.json >/dev/null
        mc admin user add -- local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc admin policy attach local corporate-app --user="$$MINIO_ACCESS_KEY" >/dev/null
        echo "MinIO ready: bucket $$MINIO_BUCKET, app user $$MINIO_ACCESS_KEY"

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # LLM_PARALLEL answers at once (uv run configure); each reserves its own
      # context memory, which the 8-bit cache (needs flash attention) halves.
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    # GPU: uncomment what matches the server.
    # Intel/AMD integrated:  devices: ["/dev/dri"]
    # NVIDIA (needs nvidia-container-toolkit):
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Migrations and seeders, once per `up`.
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *db-env
    command: ["sh", "-c", "cd /app && alembic upgrade heads && cd src && python -m seeders.run"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  backend:
    <<: *app
    environment:
      <<: *worker-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?is empty; run uv run setup in backend/}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-}
      CHAT_QUESTIONS_PER_10_MIN: ${CHAT_QUESTIONS_PER_10_MIN:-}
      API_DOCS: "false"
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
      vault-tunnel: {condition: service_started, required: false}

  worker:
    <<: *app
    environment:
      <<: *worker-env
    command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      vault-tunnel: {condition: service_started, required: false}

  # KEY_STORE=vault only (profile "vault", set by deploy.sh): the one way
  # from the internal network to Vault, and only to Vault. Plain TCP: TLS
  # runs from the backend to Vault itself, checked against Vault's name.
  vault-tunnel:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    profiles: [vault]
    command: ["TCP-LISTEN:8200,fork,reuseaddr", "TCP:${VAULT_UPSTREAM:-vault:8200}"]
    networks: [internal, egress]

  proxy:
    image: corpus-proxy:latest
    restart: unless-stopped
    # No secrets: only what the Caddyfile reads.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS: ${TLS:-internal}
      BACKEND: backend:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
    depends_on:
      - backend

  # Downloads the embedding model and the LLM. Profile "setup": runs only
  # when asked (deploy/deploy.sh models) and is the only container with
  # internet access.
  models:
    <<: *app
    restart: "no"
    profiles: [setup]
    # The only container with internet access: no secrets, no internal network.
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?is empty; run uv run setup in backend/}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    command: ["python", "-m", "maintenance.download_models"]
    networks: [egress]

  models-llm:
    image: ollama/ollama:0.34.3
    restart: "no"
    profiles: [setup]
    environment:
      LLM_MODEL: ${LLM_MODEL:?is empty; run uv run setup in backend/}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$LLM_MODEL"
    volumes:
      - ollama_data:/root/.ollama
    networks: [egress]

networks:
  internal:
    internal: true
  edge: {}
  egress: {}

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
  hf_models:
  caddy_data:
  caddy_config:
