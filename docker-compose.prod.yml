name: corpus

# Production stack. Run through deploy/deploy.sh: it passes backend/.env (or
# CORPUS_ENV_FILE) to fill the ${...} values below. Network isolation is the point of this file:
#   internal  - every service; no route to the internet (internal: true)
#   edge      - only the HTTPS proxy, the one published port
#   egress    - only the `models` job (profile "setup"), run on purpose to
#               download AI models, vault-tunnel (KEY_STORE=vault), which
#               forwards to Vault alone, sso-tunnel (OIDC_ISSUER), which
#               forwards to the SSO provider alone, and s3-tunnel (STORAGE=s3),
#               which forwards to the company's S3 storage alone; nothing
#               else can reach out.

# Each container gets only the variables it needs (never the whole .env): a
# compromised proxy or database container must not see the encryption key,
# the JWT secret or other services' passwords. An empty optional value means
# the backend default (settings.py).
#   migrate  - database and search index only
#   worker   - + queue, document files, encryption key, LLM
#   backend  - + JWT secret (sessions) and chat settings
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?is empty; run uv run install in backend/}
  DB_PASSWORD: ${DB_PASSWORD:?is empty; run uv run install in backend/}
  DB_NAME: ${DB_NAME:?is empty; run uv run install in backend/}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_API_KEY: ${QDRANT_API_KEY:?is empty; run uv run install in backend/}
  APP_LANGUAGE: ${APP_LANGUAGE:-}
  APP_LANGUAGES: ${APP_LANGUAGES:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?is empty; run uv run install in backend/}

x-worker-env: &worker-env
  <<: *db-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?is empty; run uv run install in backend/}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?is empty; run uv run install in backend/}
  # Document files: the documents_data volume (STORAGE=disk), or the
  # company's S3 storage through s3-tunnel (STORAGE=s3).
  STORAGE: ${STORAGE:-disk}
  STORAGE_DIR: /data/documents
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_REGION: ${S3_REGION:-}
  S3_CACERT: ${S3_CACERT:+/etc/corpus-s3/ca.pem}
  S3_CONNECT: ${S3_ENDPOINT:+s3-tunnel:9000}
  # KEY_STORE=env: the key below (and the previous one while rotating).
  # KEY_STORE=vault: read from HashiCorp Vault through vault-tunnel instead
  # (backend/src/key_store.py); the two key variables are then empty.
  KEY_STORE: ${KEY_STORE:-env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
  VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-}
  VAULT_KV_PATH: ${VAULT_KV_PATH:-}
  VAULT_CACERT: ${VAULT_CACERT:+/etc/corpus-vault/ca.pem}
  VAULT_CONNECT: ${VAULT_ADDR:+vault-tunnel:8200}
  LLM_HOST: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:?is empty; run uv run install in backend/}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-}
  TEXT_CLEANUP: ${TEXT_CLEANUP:-}
  CHUNK_SIZE: ${CHUNK_SIZE:-}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-}

x-app: &app
  image: corpus-backend:latest
  restart: unless-stopped
  # Runs as an unprivileged user (Dockerfile) and needs no Linux privileges:
  # code that breaks in (a parser, LibreOffice) cannot gain any.
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - hf_models:/models/hf
    # CA of Vault's certificate, copied here by `uv run install` (not a secret).
    - ./deploy/vault:/etc/corpus-vault:ro
    # CA of the SSO provider's certificate, copied by `uv run configure`.
    - ./deploy/sso:/etc/corpus-sso:ro
    # CA of the company's S3 storage, copied by `uv run configure`.
    - ./deploy/s3:/etc/corpus-s3:ro
  networks: [internal]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?is empty; run uv run install in backend/}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?is empty; run uv run install in backend/}
      POSTGRES_DB: ${DB_NAME:?is empty; run uv run install in backend/}
    # POSTGRES_PASSWORD only applies to a new volume; re-apply it on every
    # start (local socket, trusted) so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        (
          until pg_isready -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done
          echo "ALTER ROLE CURRENT_USER PASSWORD :'pw';" |
            psql -q -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v pw="$$POSTGRES_PASSWORD"
        ) &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?is empty; run uv run install in backend/}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?is empty; run uv run install in backend/}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?is empty; run uv run install in backend/}
    # The default user is only created on a new volume; re-apply the password
    # on every start so a password rotated in .env works.
    entrypoint:
      - /bin/bash
      - -c
      - |
        (
          until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1 ||
            rabbitmqctl -q change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl -q set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl -q set_permissions -p / "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # LLM_PARALLEL answers at once (uv run configure); each reserves its own
      # context memory, which the 8-bit cache (needs flash attention) halves.
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Intel/AMD integrated GPU: uncomment with the lines below.
      # OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    # GPU: uncomment what matches the server.
    # Intel/AMD integrated (Vulkan): the device, the host's video and render
    # group ids (`getent group video render`), and integrated GPUs allowed.
    # devices: ["/dev/dri"]
    # group_add: ["VIDEO-GID", "RENDER-GID"]
    # NVIDIA (needs nvidia-container-toolkit):
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Migrations and seeders, once per `up`.
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *db-env
    command: ["sh", "-c", "cd /app && alembic upgrade heads && cd src && python -m seeders.run"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  backend:
    <<: *app
    environment:
      <<: *worker-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?is empty; run uv run install in backend/}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-}
      ERROR_LOG_RETENTION_DAYS: ${ERROR_LOG_RETENTION_DAYS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-}
      OIDC_CACERT: ${OIDC_CACERT:+/etc/corpus-sso/ca.pem}
      OIDC_CONNECT: ${OIDC_ISSUER:+sso-tunnel:443}
      CHAT_QUESTIONS_PER_10_MIN: ${CHAT_QUESTIONS_PER_10_MIN:-}
      API_DOCS: "false"
    # The app's mounts plus the document files (STORAGE=disk): only the
    # backend and the worker see them, never the internet-facing models job.
    volumes: &documents-volumes
      - hf_models:/models/hf
      - ./deploy/vault:/etc/corpus-vault:ro
      - ./deploy/sso:/etc/corpus-sso:ro
      - ./deploy/s3:/etc/corpus-s3:ro
      - documents_data:/data/documents
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      ollama: {condition: service_healthy}
      vault-tunnel: {condition: service_started, required: false}
      sso-tunnel: {condition: service_started, required: false}
      s3-tunnel: {condition: service_started, required: false}

  worker:
    <<: *app
    environment:
      <<: *worker-env
    command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
    volumes: *documents-volumes
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      vault-tunnel: {condition: service_started, required: false}
      s3-tunnel: {condition: service_started, required: false}

  # KEY_STORE=vault only (profile "vault", set by deploy.sh): the one way
  # from the internal network to Vault, and only to Vault. Plain TCP: TLS
  # runs from the backend to Vault itself, checked against Vault's name.
  vault-tunnel:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    profiles: [vault]
    command: ["TCP-LISTEN:8200,fork,reuseaddr", "TCP:${VAULT_UPSTREAM:-vault:8200}"]
    networks: [internal, egress]

  # OIDC_ISSUER set only (profile "sso", set by deploy.sh): the backend's one
  # way to the company's sign-in server, and only to it. Plain TCP: TLS runs
  # from the backend to the provider itself, checked against its name.
  sso-tunnel:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    profiles: [sso]
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:${SSO_UPSTREAM:-sso:443}"]
    networks: [internal, egress]

  # STORAGE=s3 only (profile "s3", set by deploy.sh): the backend's and the
  # worker's one way to the company's S3 storage, and only to it. Plain TCP:
  # TLS runs from Corpus to the storage itself, checked against its name.
  s3-tunnel:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    profiles: [s3]
    command: ["TCP-LISTEN:9000,fork,reuseaddr", "TCP:${S3_UPSTREAM:-s3:443}"]
    networks: [internal, egress]

  proxy:
    image: corpus-proxy:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # No secrets: only what the Caddyfile reads.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS: ${TLS:-internal}
      BACKEND: backend:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
    depends_on:
      - backend

  # Downloads the embedding model and the LLM. Profile "setup": runs only
  # when asked (deploy/deploy.sh models) and is the only container with
  # internet access.
  models:
    <<: *app
    restart: "no"
    profiles: [setup]
    # The only container with internet access: no secrets, no internal network.
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?is empty; run uv run install in backend/}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    command: ["python", "-m", "maintenance.download_models"]
    networks: [egress]

  models-llm:
    image: ollama/ollama:0.34.3
    restart: "no"
    profiles: [setup]
    environment:
      LLM_MODEL: ${LLM_MODEL:?is empty; run uv run install in backend/}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$LLM_MODEL"
    volumes:
      - ollama_data:/root/.ollama
    networks: [egress]

networks:
  internal:
    internal: true
  edge: {}
  egress: {}

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  # Document files (STORAGE=disk), encrypted by the app.
  documents_data:
  ollama_data:
  hf_models:
  caddy_data:
  caddy_config:
