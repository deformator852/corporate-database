name: corpus

# Production stack. Run through deploy/deploy.sh (it passes backend/.env, or
# CORPUS_ENV_FILE, for the ${...} values and the containers). Network isolation is the point of this file:
#   internal  - every service; no route to the internet (internal: true)
#   edge      - only the HTTPS proxy, the one published port
#   egress    - only the `models` job (profile "setup"), run on purpose to
#               download AI models; nothing else can reach the internet.

x-app: &app
  image: corpus-backend:latest
  restart: unless-stopped
  env_file: ${CORPUS_ENV_FILE:-./backend/.env}
  environment: &app-env
    DB_HOST: postgres
    DB_PORT: "5432"
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    MINIO_ENDPOINT: minio:9000
    MINIO_SECURE: "false"
    LLM_HOST: http://ollama:11434
  volumes:
    - hf_models:/models/hf
  networks: [internal]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${DB_PASSWORD:?is empty; run uv run setup in backend/}"
        export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_NAME"
        (
          until pg_isready -q -h /var/run/postgresql -U "$$DB_USER" -d "$$DB_NAME"; do sleep 1; done
          echo "ALTER ROLE CURRENT_USER PASSWORD :'pw';" |
            psql -q -h /var/run/postgresql -U "$$DB_USER" -d "$$DB_NAME" -v pw="$$DB_PASSWORD"
        ) &
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${QDRANT_API_KEY:?is empty; run uv run setup in backend/}"
        exec env -i PATH="$$PATH" TZ=Etc/UTC RUN_MODE=production \
          QDRANT__SERVICE__API_KEY="$$QDRANT_API_KEY" \
          QDRANT__TELEMETRY_DISABLED=true ./entrypoint.sh
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.[01] 200\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    hostname: rabbitmq
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${RABBITMQ_PASSWORD:?is empty; run uv run setup in backend/}"
        export RABBITMQ_DEFAULT_USER="$$RABBITMQ_USER" RABBITMQ_DEFAULT_PASS="$$RABBITMQ_PASSWORD"
        (
          until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q add_user "$$RABBITMQ_USER" "$$RABBITMQ_PASSWORD" >/dev/null 2>&1 ||
            rabbitmqctl -q change_password "$$RABBITMQ_USER" "$$RABBITMQ_PASSWORD"
          rabbitmqctl -q set_user_tags "$$RABBITMQ_USER" administrator
          rabbitmqctl -q set_permissions -p / "$$RABBITMQ_USER" ".*" ".*" ".*"
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        : "$${MINIO_ROOT_PASSWORD:?is empty; run uv run setup in backend/}"
        exec env -i PATH="$$PATH" \
          MINIO_ROOT_USER="$$MINIO_ROOT_USER" \
          MINIO_ROOT_PASSWORD="$$MINIO_ROOT_PASSWORD" \
          MINIO_UPDATE=off \
          minio server /data
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    networks: [internal]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        : "$${MINIO_SECRET_KEY:?is empty; run uv run setup in backend/}"
        export MC_CONFIG_DIR=/tmp/mc
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null
        mc anonymous set none "local/$$MINIO_BUCKET" >/dev/null
        cat > /tmp/policy.json <<POLICY
        {"Version": "2012-10-17", "Statement": [{"Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
          "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]}]}
        POLICY
        mc admin policy create local corporate-app /tmp/policy.json >/dev/null
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc admin policy attach local corporate-app --user "$$MINIO_ACCESS_KEY" >/dev/null
        echo "MinIO ready: bucket $$MINIO_BUCKET, app user $$MINIO_ACCESS_KEY"

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    # GPU: uncomment what matches the server.
    # Intel/AMD integrated:  devices: ["/dev/dri"]
    # NVIDIA (needs nvidia-container-toolkit):
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Migrations and seeders, once per `up`.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "cd /app && alembic upgrade heads && cd src && python -m seeders.run"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  backend:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}

  worker:
    <<: *app
    command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  proxy:
    image: corpus-proxy:latest
    restart: unless-stopped
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    environment:
      BACKEND: backend:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
    depends_on:
      - backend

  # Downloads the embedding model and the LLM. Profile "setup": runs only
  # when asked (deploy/deploy.sh models) and is the only container with
  # internet access.
  models:
    <<: *app
    restart: "no"
    profiles: [setup]
    environment:
      <<: *app-env
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    command: ["python", "-m", "maintenance.download_models"]
    networks: [egress]

  models-llm:
    image: ollama/ollama:0.34.3
    restart: "no"
    profiles: [setup]
    env_file: ${CORPUS_ENV_FILE:-./backend/.env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$LLM_MODEL"
    volumes:
      - ollama_data:/root/.ollama
    networks: [egress]

networks:
  internal:
    internal: true
  edge: {}
  egress: {}

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
  hf_models:
  caddy_data:
  caddy_config:
